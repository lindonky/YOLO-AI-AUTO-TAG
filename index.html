        // 桌面端默认使用深色工具主题，并在 CSS 解析前应用，避免启动时先白后黑的闪屏。
        try {
            if (localStorage.getItem('theme') !== 'light') {
                document.documentElement.classList.add('dark');
            }
        } catch (_error) {
            document.documentElement.classList.add('dark');
        }
    </script>

                </button>

            <button id="quickTeachingBtn" type="button" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm transition whitespace-nowrap flex items-center gap-2" title="先手动画几个准确框，让模型参考这些示例识别其他图片">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M8 8h8v8H8z" />
                </svg>
                <span id="quickTeachingText">示例教学</span>
                <span id="quickTeachingCount" class="bg-white text-indigo-600 rounded-full px-2 py-0.5 text-[10px]">0</span>
            </button>

            <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm transition whitespace-nowrap flex items-center gap-2">
                <span id="btnText">开始分析</span>
                <div id="loader" class="loading w-4 h-4 border-2"></div>
            </button>
            <button id="downloadBtn" class="hidden"></button>

            <!-- Theme Toggle -->
             <button id="themeToggleBtn" class="p-2 text-gray-400 hover:text-yellow-500 rounded-lg transition" type="button" aria-label="切换深色模式" title="切换深色模式">
                <svg id="themeIconSun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="themeIconMoon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="app-workbench flex flex-1 overflow-hidden">
        <!-- Sidebar: File List -->
        <div class="app-file-sidebar w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col shrink-0 transition-colors duration-200">
            <div class="app-pane-header p-3 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-750">
                <span class="font-bold text-gray-700 dark:text-gray-200 text-sm">文件列表</span>
                <span id="fileCount" class="bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-200 text-xs px-2 py-0.5 rounded-full">0</span>
            </div>
            <div id="fileList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center text-gray-400 text-xs mt-10">暂无文件</div>
            </div>
             <!-- Progress Bar (Moved to bottom of sidebar) -->
            <div id="progressContainer" class="hidden p-3 border-t bg-gray-50 dark:bg-gray-750 dark:border-gray-700">
                <div class="flex justify-between text-xs text-gray-600 dark:text-gray-400 mb-1">
                    <span id="progressText">处理中...</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-bar h-1.5 bg-gray-200 dark:bg-gray-600 rounded-full overflow-hidden">
                    <div id="progressFill" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="app-canvas-pane flex-1 bg-gray-100 dark:bg-gray-900 relative flex flex-col overflow-hidden transition-colors duration-200">
            <!-- Always-visible controls while drawing a teaching example -->
            <div id="teachingFloatingToolbar" class="hidden items-center gap-2 bg-white dark:bg-gray-800 border border-indigo-500 rounded-lg shadow-xl px-3 py-2" style="position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:25; min-width:620px; max-width:calc(100% - 32px);">
                <div class="flex-1" style="min-width:0;">
                    <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400">人工示例教学 · 在目标外沿拖动画框</div>
                    <div id="teachingFloatingStatus" class="text-[10px] text-gray-500 dark:text-gray-400 truncate">已保存 0 张 / 0 框 · 当前编辑 0 框</div>
                </div>
                <select id="teachingFloatingLabelSelect" aria-label="新框类别" class="p-1.5 rounded text-xs dark:bg-gray-700 dark:text-gray-200" style="max-width:140px"><option value="target">target</option></select>
                <button id="saveTeachingFloatingBtn" type="button" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold transition whitespace-nowrap">保存示例</button>
                <button id="undoTeachingFloatingBtn" type="button" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition whitespace-nowrap">撤销一框</button>
                <button id="exitTeachingFloatingBtn" type="button" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1.5 rounded text-xs font-bold transition whitespace-nowrap">退出框选</button>
            </div>

            <!-- Canvas/Video Area -->
            <div class="app-canvas-stage flex-1 p-4 overflow-hidden flex items-center justify-center">
                 <div class="video-wrapper border-2 border-dashed border-gray-300 dark:border-gray-700 shadow-sm rounded-lg relative" id="viewContainer">
                    <!-- Image Mode Canvas -->
                    <canvas id="imageCanvas" class="block w-full h-full"></canvas>
                    
                    <!-- Video Mode Elements -->
                    <video id="videoPlayer" class="video-decoder" playsinline crossorigin="anonymous"></video>
                    <canvas id="overlayCanvas" class="hidden"></canvas>
                </div>
            </div>

            <div id="videoControls" class="hidden px-4 pb-3">
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm px-3 py-2 flex items-center gap-3">
                    <button id="videoPlayBtn" class="shrink-0 px-3 py-1.5 text-xs font-semibold bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">播放</button>
                    <input id="videoSeek" type="range" min="0" max="0" value="0" step="0.01" class="flex-1 accent-indigo-600">
                    <div id="videoTime" class="shrink-0 text-xs text-gray-600 dark:text-gray-400 font-mono w-28 text-right">0:00 / 0:00</div>
                </div>
            </div>
            
            <!-- Bottom Status Bar -->
            <div class="app-statusbar bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-1 px-4 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 shrink-0 transition-colors duration-200" role="status" aria-live="polite">
                <p id="statusMsg" class="italic truncate max-w-lg">等待任务...</p>
                <p id="apiInfo" class="font-mono"></p>
            </div>
        </div>

        <!-- Right Floating Toolbar -->
        <div class="app-toolrail w-12 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 flex flex-col items-center py-4 gap-4 shrink-0 z-10 transition-colors duration-200" role="toolbar" aria-label="工作区面板">
             <button id="cropPreviewBtn" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-indigo-50 dark:hover:bg-indigo-900 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-lg transition" title="剪裁预览" type="button" aria-label="打开剪裁预览" aria-controls="cropPreview" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z" />
                </svg>
            </button>
             <button id="timelineResultsBtn" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-indigo-50 dark:hover:bg-indigo-900 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-lg transition" title="时间轴" type="button" aria-label="打开时间轴" aria-controls="timelineResults" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </div>
    </div>
    
<!-- Task Menu has been merged into #settingsMenu, removed from here -->
    <!-- Crop Preview & Timeline (Same as before) -->
    <div id="cropPreview" class="app-floating-inspector hidden absolute right-14 top-16 bottom-10 w-64 bg-white dark:bg-gray-800 shadow-2xl border-l border-gray-200 dark:border-gray-700 overflow-y-auto p-3 z-30 floating-panel transition-colors duration-200">
        <h3 class="font-bold text-gray-700 dark:text-gray-200 mb-2 border-l-4 border-emerald-500 pl-2 text-sm">提取区域预览</h3>
        <div id="cropGallery" class="space-y-3"></div>
    </div>
    <div id="timelineResults" class="app-floating-inspector hidden absolute right-14 top-16 bottom-10 w-72 bg-white dark:bg-gray-800 shadow-2xl border-l border-gray-200 dark:border-gray-700 overflow-y-auto p-3 z-30 floating-panel transition-colors duration-200">
        <h3 class="font-bold text-gray-700 dark:text-gray-200 mb-2 border-l-4 border-indigo-500 pl-2 text-sm">追踪结果时间轴</h3>
        <div id="timelineContent" class="space-y-2"></div>
    </div>
